name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build qt6-base-dev qt6-charts-dev \
            qt6-datavisualization-dev qt6-declarative-dev libgl1-mesa-dev libxkbcommon-dev
      - name: Build and run tests
        run: ./scripts/build.sh
